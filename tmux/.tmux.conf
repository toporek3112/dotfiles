# Easy config reload
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# mouse behavior
setw -g mouse on

# disable tmux right-click menus
unbind -T root MouseDown3Pane
unbind -T root MouseDown3Status
unbind -T root MouseDown3StatusLeft
unbind -T root M-MouseDown3Pane
unbind -T root M-MouseDown3Status
unbind -T root M-MouseDown3StatusLeft

# paste tmux buffer on right click inside panes
bind -T root MouseDown3Pane paste-buffer

# use vim-like keys for splits and windows
set -g mode-keys vi   # for vim keybindings in copy mode
bind-key v split-window -h
bind-key s split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

# smart pane switching with awareness of vim splits
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-l) || tmux select-pane -R"
bind -n 'C-\' run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys 'C-\\') || tmux select-pane -l"
bind C-l send-keys 'C-l'

# ─────────────────────────────────────────────
# PANE STYLING
# ─────────────────────────────────────────────

set -g pane-border-style 'fg=#3c3c3c'
set -g pane-active-border-style 'fg=#ff5f5f'

set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[bold] ACTIVE #[default],}#{pane_index}: #{pane_current_command}'

# ─────────────────────────────────────────────
# STATUS BAR
# ─────────────────────────────────────────────

set -g status-interval 1

# Use terminal background
set -g status-style 'bg=default,fg=white'
# Session name
set -g status-left '#[bold]#S#[default] '
# Right side
set -g status-right '%a %H:%M:%S %p #[fg=blue]%d-%m-%Y'
# Space between windows
set -g window-status-separator ' '
# Inactive windows
set -g window-status-format \
  '#[bg=default,fg=#aaaaaa] #I:#W '
# Active window
set -g window-status-current-format \
  '#[bold,bg=#444444,fg=#ff5f5f] #I:#W #[default]'

# ─────────────────────────────────────────────
# PLUGINS
# ─────────────────────────────────────────────

# TPM - Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Save/restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore automatically when tmux starts
set -g @continuum-restore 'on'

# Save every 15 minutes
set -g @continuum-save-interval '15'

# Programs that tmux-resurrect should restart
set -g @resurrect-processes 'btop nvtop watch'

# ─────────────────────────────────────────────
# TPM BOOTSTRAP
# ─────────────────────────────────────────────

# Install TPM automatically if missing
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Must stay at the bottom
run '~/.tmux/plugins/tpm/tpm'
