[[mgr.prepend_keymap]]
on = "+"
run = "plugin zoom 1"
desc = "Zoom in hovered file"

[[mgr.prepend_keymap]]
on = "-"
run = "plugin zoom -1"
desc = "Zoom out hovered file"

[[mgr.prepend_keymap]]
on = [ "g", "n" ]
run = 'shell "setsid -f nautilus . >/dev/null 2>&1"'
desc = "Open current directory in Nautilus"

